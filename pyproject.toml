[project]
name = "fyntok"
version = "0.1.0"
description = "Local historical transaction categorization and analysis"
requires-python = ">=3.14,<3.15"
dependencies = [
    "SQLAlchemy==2.1.6",
    "httpx==0.28.1",
    "nicegui[plotly]==3.18.0",
    "plotly==6.9.0",
    "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.3",
    "ty==0.0.93",
]

[project.scripts]
fyntok = "fyntok.cli:main"

[build-system]
requires = ["uv_build==0.11.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Full-suite benchmarks favor four processes; work stealing balances the slower UI tests.
# Override with `just test -n 0` for serial debugging or `just test -n 2` for fewer workers.
addopts = "-n 4 --dist=worksteal --cov --cov-report=term-missing:skip-covered --cov-report=html --cov-report=xml --cov-fail-under=89"

[tool.coverage.run]
source = ["src/fyntok"]
branch = true

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Correctness, security, modern Python, annotations, and maintainability.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ANN", "ASYNC", "S", "RET", "ARG", "PTH", "RUF"]
# Dynamic JSON and third-party UI boundaries may use explicit Any.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the test runner's API; fixture bytes are not credentials.
"**/test_*.py" = ["S101", "S105", "S106"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-generic-narrowing = true
strict-equality-semantics = true

[tool.ty.terminal]
error-on-warning = true
